<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gnash</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e3e3e0;
    --accent: #c2410c; --accent-fg: #fff; --hover: #f3f3f1;
    --user: #1d4ed8; --user-bg: #eff4ff; --pend: #a16207; --pend-bg: #fdf6e3;
    --warn-bg: #fff7ed; --warn-line: #fdba74; --add: #e7f6ec; --add-fg: #166534; --del: #fdecec; --del-fg: #991b1b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161617; --panel: #1e1e20; --fg: #ececee; --muted: #9a9aa1; --line: #313134;
      --accent: #fb923c; --accent-fg: #1a1a1a; --hover: #262629;
      --user: #93b4ff; --user-bg: #1c2540; --pend: #facc15; --pend-bg: #33290d;
      --warn-bg: #2b1d10; --warn-line: #9a4d12; --add: #12301d; --add-fg: #86efac; --del: #3a1616; --del-fg: #fca5a5;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  code, .mono, td, input, select, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
  button, input, select { font: inherit; color: inherit; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .grow { flex: 1; }
  select, input[type=search], input[type=text] { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  button.link { border: 0; background: none; padding: 2px 4px; color: var(--muted); font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  button.link:hover { color: var(--fg); background: none; text-decoration: underline; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  main { padding: 12px 16px 96px; }
  .notice { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .toolbar input[type=search] { flex: 1 1 260px; min-width: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
  .seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed=true] { background: var(--fg); color: var(--bg); }
  .count { color: var(--muted); font-size: 12.5px; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font: 600 12px system-ui, sans-serif; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; max-width: 32ch; }
  tr:last-child td { border-bottom: 0; }
  td.name { max-width: 46ch; }
  td.actions { white-space: nowrap; text-align: right; max-width: none; }
  .none { color: var(--muted); opacity: .6; }
  .user { color: var(--user); background: var(--user-bg); border-radius: 4px; padding: 0 4px; }
  .pending { color: var(--pend); background: var(--pend-bg); border-radius: 4px; padding: 0 4px; }
  .removed { text-decoration: line-through; }
  .badge { display: inline-block; font: 600 10.5px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .03em; padding: 1px 5px; border-radius: 4px; margin-left: 6px; border: 1px solid var(--line); color: var(--muted); vertical-align: 1px; }
  .badge.warn { border-color: var(--warn-line); color: var(--pend); }
  .editor { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .editor input[type=text] { min-width: 12ch; flex: 1; }
  .err { color: var(--del-fg); font-size: 12px; width: 100%; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: center; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--line); }
  .bar[hidden] { display: none; }
  dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--fg); padding: 0; width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 64px); }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  .dlg { display: flex; flex-direction: column; max-height: calc(100vh - 64px); }
  .dlg h2 { margin: 0; font-size: 15px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .dlg .body { padding: 12px 16px; overflow: auto; }
  .dlg .foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); }
  .dlg p { margin: 0 0 10px; color: var(--muted); }
  pre.diff { margin: 0; border: 1px solid var(--line); border-radius: 6px; overflow: auto; }
  pre.diff span { display: block; padding: 0 8px; white-space: pre; }
  pre.diff .a { background: var(--add); color: var(--add-fg); }
  pre.diff .d { background: var(--del); color: var(--del-fg); }
  pre.diff .h { color: var(--muted); }
  .form { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; }
  .toast { position: fixed; right: 16px; bottom: 76px; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; max-width: calc(100vw - 32px); }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  @media (max-width: 640px) { td.def, th.def { display: none; } }
</style>
</head>
<body>
<header>
  <h1>gnash<span>Firefox prefs</span></h1>
  <div class="grow"></div>
  <label class="count" for="profile">Profile</label>
  <select id="profile"></select>
</header>
<main>
  <div id="notices"></div>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Filter by pref name or value" aria-label="Filter prefs">
    <div class="seg" role="group" aria-label="Show">
      <button data-f="changed" aria-pressed="true" title="Set in prefs.js or user.js">Changed</button>
      <button data-f="userjs" aria-pressed="false">In user.js</button>
      <button data-f="conflict" aria-pressed="false" title="user.js and prefs.js disagree">Differs</button>
      <button data-f="nodefault" aria-pressed="false" title="Not in this install's default files">No default</button>
      <button data-f="all" aria-pressed="false">All</button>
    </div>
    <button id="add">Add pref</button>
    <span class="count" id="count"></span>
  </div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Pref</th><th class="def">Default</th><th>prefs.js</th><th>user.js</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="empty" class="empty" hidden></div>
</main>

<div class="bar" id="bar" hidden>
  <span id="pendingText"></span>
  <div class="grow"></div>
  <button id="discard">Discard</button>
  <button id="review" class="primary">Review changes</button>
</div>

<dialog id="reviewDlg">
  <div class="dlg">
    <h2>Review changes to user.js</h2>
    <div class="body">
      <p>Nothing is written until you apply. user.js and prefs.js are backed up first. Changes take effect the next time Firefox starts.</p>
      <pre class="diff" id="diff"></pre>
    </div>
    <div class="foot"><button id="cancelReview">Back</button><button id="apply" class="primary">Apply</button></div>
  </div>
</dialog>

<dialog id="addDlg">
  <form class="dlg" id="addForm" method="dialog">
    <h2>Add a pref to user.js</h2>
    <div class="body form">
      <label for="addName">Name</label><input id="addName" type="text" required autocomplete="off" placeholder="browser.example.pref">
      <label for="addType">Type</label><select id="addType"><option>string</option><option>integer</option><option>boolean</option></select>
      <label for="addValue">Value</label><input id="addValue" type="text" autocomplete="off">
      <span></span><span class="err" id="addErr"></span>
    </div>
    <div class="foot"><button type="button" id="cancelAdd">Cancel</button><button class="primary" value="ok">Add</button></div>
  </form>
</dialog>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const LIMIT = 400;
const state = { profiles: [], id: null, data: null, pending: new Map(), filter: "changed", q: "", editing: null, hash: null };

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(json.error || res.statusText), { status: res.status });
  return json;
}

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}

const fmt = (v) => (typeof v === "string" ? JSON.stringify(v) : String(v));
const typeOf = (v) => (typeof v === "boolean" ? "boolean" : typeof v === "number" ? "integer" : "string");
const valueCell = (v, cls = "") => (v === undefined ? el("span", { class: "none" }, "—") : el("span", { class: cls }, fmt(v)));

function parseValue(type, raw) {
  if (type === "boolean") {
    if (raw === "true" || raw === "false") return raw === "true";
    throw new Error("Enter true or false");
  }
  if (type === "integer") {
    if (!/^[+-]?\d+$/.test(raw.trim())) throw new Error("Enter a whole number");
    const n = Number(raw);
    if (n < -(2 ** 31) || n >= 2 ** 31) throw new Error("Out of range for a Firefox integer");
    return n;
  }
  return raw;
}

function toast(msg) {
  const t = el("div", { class: "toast", role: "status" }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 5000);
}

// --- loading ---------------------------------------------------------------

async function loadProfiles() {
  state.profiles = await api("/api/profiles");
  const sel = $("#profile");
  sel.replaceChildren();
  if (!state.profiles.length) {
    sel.append(el("option", {}, "No Firefox profiles found"));
    sel.disabled = true;
    showEmpty("No Firefox profiles were found on this computer.");
    return;
  }
  const saved = store.get("gnash.profile");
  const pick = state.profiles.find((p) => p.id === saved) || (state.profiles.length === 1 ? state.profiles[0] : null);
  if (!pick) sel.append(el("option", { value: "" }, "Choose a profile…"));
  for (const p of state.profiles) {
    const label = `${p.browser}: ${p.name}${p.isDefault ? " (default)" : ""}${p.version ? ` · ${p.version}` : ""}`;
    sel.append(el("option", { value: p.id }, label));
  }
  if (pick) { sel.value = pick.id; await selectProfile(pick.id); }
  else showEmpty("Pick the profile you want to edit.");
}

async function selectProfile(id) {
  if (state.pending.size && !confirmDiscard()) { $("#profile").value = state.id; return; }
  state.id = id; state.pending.clear(); state.editing = null;
  store.set("gnash.profile", id);
  await reload();
}

function confirmDiscard() {
  // Inline confirmation instead of window.confirm, which blocks the page.
  toast("Apply or discard your pending changes first.");
  return false;
}

async function reload() {
  if (!state.id) return;
  state.data = await api(`/api/profiles/${state.id}`);
  state.hash = state.data.userJsHash;
  renderNotices();
  render();
}

function renderNotices() {
  const n = $("#notices");
  n.replaceChildren();
  const d = state.data;
  if (d.running) n.append(el("div", { class: "notice" }, "Firefox is running. You can still edit user.js; changes apply the next time Firefox starts."));
  if (!d.defaultsFound) n.append(el("div", { class: "notice" }, "Couldn't read default values from this profile's Firefox install. Start Firefox once with this profile, then reload."));
}

function showEmpty(msg) {
  $("#rows").replaceChildren();
  $("#count").textContent = "";
  const e = $("#empty"); e.hidden = false; e.textContent = msg;
}

// --- table -----------------------------------------------------------------

function userValue(r) { return state.pending.has(r.name) ? state.pending.get(r.name) : r.user; }

function matches(r) {
  const pend = state.pending.has(r.name);
  const u = userValue(r);
  switch (state.filter) {
    case "changed": if (r.prefs === undefined && r.user === undefined && !pend) return false; break;
    case "userjs": if (r.user === undefined && !pend) return false; break;
    case "conflict": if (u === undefined || u === null || r.prefs === undefined || u === r.prefs) return false; break;
    case "nodefault": if (r.def !== undefined) return false; break;
  }
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return r.name.toLowerCase().includes(q) || [r.def, r.prefs, u].some((v) => v != null && String(v).toLowerCase().includes(q));
}

function allRows() {
  const rows = state.data.rows.slice();
  const known = new Set(rows.map((r) => r.name));
  for (const name of state.pending.keys()) if (!known.has(name)) rows.push({ name });
  return rows.sort((a, b) => a.name.localeCompare(b.name));
}

function render() {
  if (!state.data) return;
  const list = allRows().filter(matches);
  const body = $("#rows");
  body.replaceChildren(...list.slice(0, LIMIT).map(renderRow));
  $("#count").textContent = list.length > LIMIT ? `Showing ${LIMIT} of ${list.length}; filter to narrow` : `${list.length} prefs`;
  const e = $("#empty");
  e.hidden = list.length > 0;
  e.textContent = "No prefs match.";
  renderBar();
}

function renderRow(r) {
  const pend = state.pending.has(r.name);
  const u = userValue(r);
  const badges = [];
  if (r.def === undefined) badges.push(el("span", { class: "badge", title: "Not in this install's default files. It may be built into Firefox, or no longer exist." }, "no default"));
  if (u != null && r.prefs !== undefined && u !== r.prefs) badges.push(el("span", { class: "badge warn", title: "user.js will replace the prefs.js value on next start" }, "differs"));

  let userCell;
  if (state.editing === r.name) userCell = renderEditor(r);
  else if (pend && u === null) userCell = el("span", { class: "pending removed" }, r.user === undefined ? "—" : fmt(r.user));
  else if (pend) userCell = valueCell(u, "pending");
  else userCell = valueCell(r.user, "user");

  const actions = [];
  if (state.editing !== r.name) {
    actions.push(el("button", { class: "link", onclick: () => { state.editing = r.name; render(); } }, u == null ? "Set" : "Edit"));
    if (u != null) actions.push(el("button", { class: "link", onclick: () => stage(r, null) }, "Remove"));
    if (pend) actions.push(el("button", { class: "link", onclick: () => { state.pending.delete(r.name); render(); } }, "Undo"));
  }
  return el("tr", {},
    el("td", { class: "name" }, r.name, ...badges),
    el("td", { class: "def" }, valueCell(r.def)),
    el("td", {}, valueCell(r.prefs)),
    el("td", {}, userCell),
    el("td", { class: "actions" }, ...actions));
}

function renderEditor(r) {
  const current = userValue(r) ?? r.prefs ?? r.def;
  const type = el("select", { "aria-label": "Type" }, ...["string", "integer", "boolean"].map((t) => el("option", {}, t)));
  type.value = current === undefined ? "string" : typeOf(current);
  const input = el("input", { type: "text", "aria-label": `Value for ${r.name}` });
  input.value = current === undefined || current === null ? "" : String(current);
  const err = el("span", { class: "err" });
  const save = () => {
    try { stage(r, parseValue(type.value, input.value)); }
    catch (e) { err.textContent = e.message; }
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") save();
    if (e.key === "Escape") { state.editing = null; render(); }
  });
  queueMicrotask(() => input.focus());
  return el("div", { class: "editor" }, type, input,
    el("button", { onclick: save }, "Save"),
    el("button", { class: "link", onclick: () => { state.editing = null; render(); } }, "Cancel"), err);
}

function stage(r, value) {
  state.editing = null;
  if (value === null && r.user === undefined) state.pending.delete(r.name); // removing something only pending
  else if (value !== null && value === r.user) state.pending.delete(r.name); // back to what's on disk
  else state.pending.set(r.name, value);
  render();
}

function renderBar() {
  const n = state.pending.size;
  $("#bar").hidden = n === 0;
  $("#pendingText").textContent = `${n} pending change${n === 1 ? "" : "s"} to user.js`;
}

// --- review & apply --------------------------------------------------------

const changes = () => [...state.pending].map(([name, value]) => ({ name, value }));

async function review() {
  try {
    const { diff, hash } = await api(`/api/profiles/${state.id}/preview`, { changes: changes() });
    state.hash = hash;
    $("#diff").replaceChildren(...diff.split("\n").filter((l, i, a) => l || i < a.length - 1).map((l) =>
      el("span", { class: l.startsWith("@@") ? "h" : l.startsWith("+") && !l.startsWith("+++") ? "a" : l.startsWith("-") && !l.startsWith("---") ? "d" : "" }, l || " ")));
    $("#apply").disabled = !diff;
    if (!diff) $("#diff").replaceChildren(el("span", {}, "These changes leave user.js exactly as it is."));
    $("#reviewDlg").showModal();
  } catch (e) { toast(e.message); }
}

async function applyChanges() {
  $("#apply").disabled = true;
  try {
    const { backup } = await api(`/api/profiles/${state.id}/apply`, { changes: changes(), hash: state.hash });
    $("#reviewDlg").close();
    state.pending.clear();
    await reload();
    toast(`Saved user.js. Backup: .gnash-backups/${backup}`);
  } catch (e) {
    if (e.status === 409) { toast("user.js changed on disk. Showing the updated diff."); await reload(); await review(); }
    else toast(e.message);
  } finally { $("#apply").disabled = false; }
}

// --- wiring ----------------------------------------------------------------

$("#profile").addEventListener("change", (e) => e.target.value && selectProfile(e.target.value).catch((err) => toast(err.message)));
$("#q").addEventListener("input", (e) => { state.q = e.target.value.trim(); render(); });
document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
  state.filter = b.dataset.f;
  document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));
$("#review").addEventListener("click", review);
$("#discard").addEventListener("click", () => { state.pending.clear(); state.editing = null; render(); });
$("#cancelReview").addEventListener("click", () => $("#reviewDlg").close());
$("#apply").addEventListener("click", applyChanges);
$("#add").addEventListener("click", () => {
  if (!state.data) return;
  $("#addForm").reset(); $("#addErr").textContent = ""; $("#addDlg").showModal();
});
$("#cancelAdd").addEventListener("click", () => $("#addDlg").close());
$("#addForm").addEventListener("submit", (e) => {
  const name = $("#addName").value.trim();
  try {
    if (!name || /[\0-\x1f\x7f]/.test(name)) throw new Error("Enter a pref name");
    const value = parseValue($("#addType").value, $("#addValue").value);
    const r = state.data.rows.find((x) => x.name === name) || { name };
    stage(r, value);
    state.q = name; $("#q").value = name;
    state.filter = "all";
    document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.f === "all")));
    render();
  } catch (err) { e.preventDefault(); $("#addErr").textContent = err.message; }
});
window.addEventListener("beforeunload", (e) => { if (state.pending.size) e.preventDefault(); });
setInterval(() => fetch("/api/ping").catch(() => {}), 30_000);

loadProfiles().catch((e) => showEmpty(e.message));
</script>
</body>
</html>
